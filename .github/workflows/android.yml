name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests (shared model and Android app)
        run: gradle :shared:test :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: clipforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests (desktop)
        run: gradle :desktop:test --no-daemon --stacktrace

      - name: Build Windows app folder
        run: gradle :desktop:createDistributable --no-daemon --stacktrace

      - name: Zip Windows app
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/ClipForge -DestinationPath ClipForge-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: clipforge-windows
          path: ClipForge-windows.zip
